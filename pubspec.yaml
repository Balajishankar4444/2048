name: infinity_merge
description: "A professional merge puzzle game."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_mobile_ads: ^5.1.0
  provider: ^6.1.5+1
  google_fonts: ^6.1.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  audioplayers: ^6.1.0   # ✅ Added here correctly

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/swipe.mp3
    - assets/collision.mp3
    - assets/bigcollision.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo.png"
  adaptive_icon_background: "#0D1B3D"
  adaptive_icon_foreground: "assets/Logo.png"